<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control de Calidad Textil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:oklch(98% 0.004 240);
    --panel:oklch(99.2% 0.002 240);
    --ink:oklch(24% 0.02 250);
    --ink-soft:oklch(46% 0.03 250);
    --line:oklch(90% 0.006 240);
    --accent:oklch(56% 0.15 255);
    --accent-soft:oklch(94% 0.03 255);
    --good:oklch(56% 0.13 152);
    --good-soft:oklch(94% 0.04 152);
    --bad:oklch(58% 0.18 25);
    --bad-soft:oklch(95% 0.035 25);
    --pending:oklch(85% 0.01 240);
    --radius:14px;
    --shadow:0 1px 2px oklch(20% 0.02 250 / 0.05), 0 8px 24px oklch(20% 0.02 250 / 0.04);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--accent)}
  a:hover{color:oklch(46% 0.16 255)}
  .app{display:flex;min-height:100vh}
  .side{width:232px;flex:none;background:oklch(20% 0.025 255);color:#fff;padding:22px 16px;display:flex;flex-direction:column;gap:28px;transition:width .2s ease,padding .2s ease;position:relative}
  .side.collapsed{width:76px;padding:22px 10px}
  .side.collapsed .brand .txt,.side.collapsed nav.nav button span,.side.collapsed .side-foot{display:none}
  .side.collapsed .brand{justify-content:center}
  .side.collapsed nav.nav button{justify-content:center}
  .side-toggle{all:unset;cursor:pointer;position:absolute;top:22px;right:-12px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .2s ease}
  .side.collapsed .side-toggle{transform:rotate(180deg)}
  .brand{display:flex;align-items:center;gap:11px;padding:0 4px}
  .brand .mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
  .brand .txt{font-size:13px;font-weight:700;letter-spacing:.02em;line-height:1.25}
  .brand .txt small{display:block;font-weight:500;color:oklch(80% 0.02 255);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;margin-top:2px}
  nav.nav{display:flex;flex-direction:column;gap:4px}
  nav.nav button{all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:oklch(85% 0.02 255);font-size:13.5px;font-weight:600}
  nav.nav button svg{flex:none;opacity:.85}
  nav.nav button:hover{background:oklch(27% 0.03 255)}
  nav.nav button.active{background:var(--accent);color:#fff}
  nav.nav button.active svg{opacity:1}
  .side-foot{margin-top:auto;font-size:10.5px;color:oklch(65% 0.02 255);line-height:1.5;padding:0 4px}
  main{flex:1;min-width:0;padding:28px 34px 48px;overflow:auto}
  .topbar{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:22px;flex-wrap:wrap}
  h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em}
  .subtitle{margin:5px 0 0;color:var(--ink-soft);font-size:13.5px}
  .updated{display:flex;align-items:center;gap:10px;font-size:11.5px;color:var(--ink-soft);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 13px}
  .updated b{color:var(--ink);display:block;font-size:12px}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px 19px;box-shadow:var(--shadow)}
  .kpi .label{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
  .kpi .value{margin-top:8px;font-size:28px;font-weight:800;letter-spacing:-.02em}
  .kpi .value.good{color:var(--good)}
  .kpi .value.bad{color:var(--bad)}
  .kpi .foot{margin-top:6px;font-size:11.5px;color:var(--ink-soft)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:999px}
  .pill.good{background:var(--good-soft);color:var(--good)}
  .pill.bad{background:var(--bad-soft);color:var(--bad)}
  .grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-bottom:14px}
  .grid3{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow)}
  .card h2{margin:0;font-size:14.5px;font-weight:700}
  .card .desc{margin:3px 0 0;font-size:11.5px;color:var(--ink-soft)}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
  .badge{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:5px 10px;white-space:nowrap}
  .legend{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin-top:10px;font-size:11px;color:var(--ink-soft);font-weight:600}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .dot.good{background:var(--good)} .dot.bad{background:var(--bad)} .dot.pending{background:var(--pending)}
  .rank{display:flex;flex-direction:column;gap:10px}
  .rank-row{display:grid;grid-template-columns:22px minmax(0,1fr) 74px;gap:10px;align-items:center}
  .rank-row .n{font-size:11px;font-weight:700;color:var(--ink-soft)}
  .rank-row .name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rank-row .name small{display:block;font-weight:500;color:var(--ink-soft);font-size:10.5px}
  .track{height:8px;background:oklch(93% 0.006 240);border-radius:999px;overflow:hidden;margin-top:4px}
  .track i{display:block;height:100%;background:var(--accent);border-radius:999px}
  .rank-row .kg{text-align:right;font-size:11.5px;font-weight:800}
  .donut-wrap{display:flex;align-items:center;gap:32px;height:100%;min-height:210px;padding:6px 4px}
  .donut{width:190px;height:190px;border-radius:50%;flex:none;position:relative;box-shadow:0 6px 20px oklch(20% 0.02 250 / 0.08)}
  .donut::after{content:"";position:absolute;inset:34px;border-radius:50%;background:var(--panel)}
  .donut-center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;z-index:1}
  .donut-center b{font-size:23px;display:block}
  .donut-center span{font-size:10.5px;color:var(--ink-soft);font-weight:600}
  .arealegend{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;min-width:0}
  .area-row{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:11px;align-items:center;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
  .area-row:last-child{border-bottom:0}
  .area-row .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .area-row .pct{font-weight:800;color:var(--ink-soft);white-space:nowrap}
  table{width:100%;border-collapse:collapse;font-size:11.5px}
  thead th{text-align:left;color:var(--ink-soft);font-weight:700;font-size:10px;letter-spacing:.05em;text-transform:uppercase;padding:0 8px 8px;border-bottom:1px solid var(--line)}
  tbody td{padding:9px 8px;border-bottom:1px solid var(--line)}
  tbody td.num{text-align:right;font-weight:700;color:var(--bad)}
  tbody tr:last-child td{border-bottom:0}
  .note{margin-top:12px;background:var(--accent-soft);border-radius:10px;padding:10px 13px;font-size:11.5px;color:oklch(38% 0.1 255)}
  @keyframes glowBad{0%,100%{box-shadow:0 0 0 0 oklch(58% 0.18 25 / .45),var(--shadow)}50%{box-shadow:0 0 0 7px oklch(58% 0.18 25 / 0),var(--shadow)}}
  @keyframes glowGood{0%,100%{box-shadow:0 0 0 0 oklch(56% 0.13 152 / .4),var(--shadow)}50%{box-shadow:0 0 0 7px oklch(56% 0.13 152 / 0),var(--shadow)}}
  .kpi.beacon{position:relative;overflow:hidden;border-width:2px}
  .kpi.beacon.on-bad{border-color:var(--bad);animation:glowBad 2.2s ease-in-out infinite}
  .kpi.beacon.on-good{border-color:var(--good);animation:glowGood 2.2s ease-in-out infinite}
  .kpi.beacon .glyph{position:absolute;right:-10px;bottom:-14px;font-size:74px;line-height:1;opacity:.07;pointer-events:none}
  .kpi.beacon .led{position:absolute;top:14px;right:14px;width:9px;height:9px;border-radius:50%}
  .kpi.beacon .led.good{background:var(--good);box-shadow:0 0 8px 1px oklch(56% 0.13 152 / .7)}
  .kpi.beacon .led.bad{background:var(--bad);box-shadow:0 0 8px 1px oklch(58% 0.18 25 / .7)}
  .gauge{position:relative;height:6px;border-radius:999px;background:oklch(93% 0.006 240);margin-top:14px;overflow:visible}
  .gauge i{display:block;height:100%;border-radius:999px}
  .gauge .mk{position:absolute;top:-3px;width:2px;height:12px;background:var(--ink);opacity:.4}
  .semaforo{position:relative;height:8px;border-radius:999px;margin-top:14px;display:flex;overflow:hidden}
  .semaforo .z{height:100%}
  .semaforo .pin{position:absolute;top:-5px;width:3px;height:18px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--panel)}
  .state{min-height:60vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--ink-soft);text-align:center;padding:40px}
  .state b{color:var(--ink);font-size:16px}
  .state code{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:12px}
  .view{display:none}
  .view.active{display:block}
  @media(max-width:1050px){.kpis{grid-template-columns:1fr 1fr}.grid2,.grid3{grid-template-columns:1fr}}
  @media(max-width:760px){.side{width:76px;padding:20px 10px}.brand .txt,nav.nav button span{display:none}.brand{justify-content:center}nav.nav button{justify-content:center}main{padding:20px 16px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="sidebar">
    <button class="side-toggle" id="sideToggle" title="Colapsar menú">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="brand">
      <div class="mark">QC</div>
      <div class="txt">CALIDAD TEXTIL<small>Control de rechazos</small></div>
    </div>
    <nav class="nav" id="nav">
      <button class="active" data-view="historico">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M10 19V9M16 19V13M22 19H2"/></svg>
        <span>Desempeño histórico</span>
      </button>
      <button data-view="diario">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
        <span>Desempeño diario</span>
      </button>
    </nav>
    <div class="side-foot">Fuente: archivo Excel maestro.<br>Reemplázalo para actualizar el tablero.</div>
  </aside>
  <main id="main">
    <div class="state" id="state"><b>Cargando datos…</b><span>Leyendo el archivo Excel maestro.</span></div>
  </main>
</div>
<script>
document.getElementById('sideToggle').onclick = () => {
  const collapsed = document.getElementById('sidebar').classList.toggle('collapsed');
  localStorage.setItem('qc-sidebar-collapsed', collapsed ? '1' : '0');
};
if (localStorage.getItem('qc-sidebar-collapsed') === '1') document.getElementById('sidebar').classList.add('collapsed');
const CFG = window.DASHBOARD_CONFIG || {};
document.title = CFG.dashboardTitle || 'Tablero de Calidad Textil';

const excelToDate = s => new Date(Math.round((s - 25569) * 86400 * 1000));
const fmtDate = (s, opts) => excelToDate(s).toLocaleDateString('es-ES', opts || {day:'2-digit', month:'short'});
const fmtPct = v => (v * 100).toFixed(1).replace('.', ',') + '%';
const fmtKg = v => v.toLocaleString('es-ES', {maximumFractionDigits: 0}) + ' kg';
const clean = s => (s || '').toString().trim();

function sheetRows(wb, name) {
  const ws = wb.Sheets[name];
  return ws ? XLSX.utils.sheet_to_json(ws, {defval: ''}) : [];
}

async function loadData() {
  const res = await fetch(CFG.dataFileName, {cache: 'no-store'});
  if (!res.ok) throw new Error('No se pudo abrir ' + CFG.dataFileName);
  const buf = await res.arrayBuffer();
  const wb = XLSX.read(buf, {type: 'array'});

  const params = sheetRows(wb, 'PARAMETROS');
  const metaRow = params.find(r => clean(r.PARAMETRO) === 'META_RECHAZO');
  const meta = metaRow ? Number(metaRow.VALOR) : (CFG.metaRechazo ?? 0.05);

  const mensual = sheetRows(wb, 'MENSUAL').filter(r => r.KILOS_TOTALES > 0);
  const semanal = sheetRows(wb, 'SEMANAL').filter(r => r.KILOS_TOTALES > 0);
  const diaria = sheetRows(wb, 'DATOS_DIARIOS');
  const rechazos = sheetRows(wb, 'RECHAZOS').filter(r => clean(r['RESOLUCIÓN']) === 'RECHAZADO');

  const control = sheetRows(wb, 'CONTROL');
  const updRow = control.find(r => clean(r[Object.keys(r)[0]]) === 'Fecha de actualización');
  const lastUpdate = updRow ? Object.values(updRow)[1] : null;

  const curMonth = mensual[mensual.length - 1];
  const diasMes = diaria.filter(r => r.AÑO === curMonth.AÑO && r.MES === curMonth.MES);
  const lastDaySerial = lastUpdate ? Math.floor(lastUpdate) : curMonth.FECHA_FIN;

  const rechazosMes = rechazos.filter(r => r['FECHA RECHAZO'] >= curMonth.FECHA_INICIO && r['FECHA RECHAZO'] <= curMonth.FECHA_FIN);

  return {meta, mensual, semanal, diaria: diasMes, rechazos, rechazosMes, curMonth, lastDaySerial, lastUpdate};
}

function aggBy(rows, key) {
  const m = new Map();
  for (const r of rows) {
    const k = clean(r[key]) || 'Sin dato';
    m.set(k, (m.get(k) || 0) + (Number(r.KILOS) || 0));
  }
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}

const AREA_COLORS = ['oklch(56% 0.15 255)', 'oklch(56% 0.13 152)', 'oklch(60% 0.14 70)', 'oklch(58% 0.18 25)', 'oklch(55% 0.12 300)'];

function yAxisTicks(max, count = 4) {
  const ticks = [];
  for (let i = count; i >= 0; i--) ticks.push(max * i / count);
  return ticks;
}

function barChart({items, meta, height = 220}) {
  const max = Math.max(meta * 1.35, ...items.map(i => i.value)) || 1;
  const metaTop = Math.max(0, Math.min(100, (1 - meta / max) * 100));
  const ticks = yAxisTicks(max);
  const bars = items.map(it => {
    const good = it.value <= meta;
    const color = good ? 'var(--good)' : 'var(--bad)';
    const h = Math.max(2, (it.value / max) * 100).toFixed(1);
    return `<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px">
      <span style="font-size:11px;font-weight:800;color:${color};white-space:nowrap">${(it.value * 100).toFixed(1)}%</span>
      <div style="width:56%;background:${color};border-radius:4px 4px 2px 2px;height:${h}%"></div>
    </div>`;
  }).join('');
  const labels = items.map(it => `<div style="flex:1;min-width:0;text-align:center;font-size:10.5px;font-weight:600;color:var(--ink-soft);overflow:hidden;white-space:nowrap">${it.label}</div>`).join('');
  const yLabels = ticks.map(t => `<div style="font-size:9.5px;color:var(--ink-soft);line-height:1">${(t * 100).toFixed(0)}%</div>`).join('');
  return `<div style="display:flex;gap:8px;height:${height}px">
    <div style="display:flex;flex-direction:column;justify-content:space-between;text-align:right;flex:none;padding-bottom:2px">${yLabels}</div>
    <div style="flex:1;min-width:0;position:relative">
      <div style="position:absolute;left:0;right:0;top:${metaTop.toFixed(1)}%;border-top:1px dashed var(--ink-soft);opacity:.55"></div>
      <div style="display:flex;align-items:flex-end;height:100%;gap:8px;position:relative">${bars}</div>
    </div>
  </div>
  <div style="display:flex;gap:8px;margin-top:8px;margin-left:34px">${labels}</div>`;
}

function dailyChart({items, meta, upToSerial, height = 200, days = 15}) {
  const shown = items.filter(i => i.serial <= upToSerial).slice(-days);
  const max = Math.max(meta * 1.4, ...shown.map(i => i.value), 0.01);
  const metaTop = Math.max(0, Math.min(100, (1 - meta / max) * 100));
  const ticks = yAxisTicks(max);
  const bars = shown.map(it => {
    const good = it.value <= meta;
    const color = good ? 'var(--good)' : 'var(--bad)';
    const h = Math.max(2, (it.value / max) * 100).toFixed(1);
    return `<div style="flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px">
      <span style="font-size:10px;font-weight:800;color:${color};white-space:nowrap">${(it.value * 100).toFixed(1)}%</span>
      <div style="width:62%;background:${color};border-radius:3px 3px 1px 1px;height:${h}%"></div>
    </div>`;
  }).join('');
  const labels = shown.map(it => {
    const d = excelToDate(it.serial);
    const dd = String(d.getDate()).padStart(2, '0');
    const mmmm = d.toLocaleDateString('es-ES', {month: 'long'});
    return `<div style="flex:1;min-width:0;display:flex;justify-content:center"><span style="font-size:8.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap;display:inline-block;transform:rotate(-40deg);transform-origin:top center">${dd}-${mmmm}</span></div>`;
  }).join('');
  const yLabels = ticks.map(t => `<div style="font-size:9.5px;color:var(--ink-soft);line-height:1">${(t * 100).toFixed(0)}%</div>`).join('');
  return `<div style="display:flex;gap:8px;height:${height}px">
    <div style="display:flex;flex-direction:column;justify-content:space-between;text-align:right;flex:none;padding-bottom:2px">${yLabels}</div>
    <div style="flex:1;min-width:0;position:relative">
      <div style="position:absolute;left:0;right:0;top:${metaTop.toFixed(1)}%;border-top:1px dashed var(--ink-soft);opacity:.55"></div>
      <div style="display:flex;align-items:flex-end;height:100%;gap:6px;position:relative">${bars}</div>
    </div>
  </div>
  <div style="display:flex;gap:6px;margin-top:12px;margin-left:34px">${labels}</div>`;
}

function donut(entries, total) {
  let acc = 0;
  const stops = entries.map((e, i) => {
    const pct = e[1] / total * 100;
    const start = acc; acc += pct;
    return `${AREA_COLORS[i % AREA_COLORS.length]} ${start}% ${acc}%`;
  }).join(', ');
  return `background: conic-gradient(${stops || '#eee 0% 100%'})`;
}

function render(data) {
  const {meta, mensual, semanal, diaria, rechazos, rechazosMes, curMonth, lastDaySerial, lastUpdate} = data;

  const ytdBuenos = mensual.reduce((s, r) => s + r.KILOS_BUENOS, 0);
  const ytdMalos = mensual.reduce((s, r) => s + r.KILOS_MALOS, 0);
  const ytdRate = ytdMalos / ytdBuenos;
  const best = mensual.reduce((a, b) => a['%_RECHAZO_S_BUENOS'] < b['%_RECHAZO_S_BUENOS'] ? a : b);
  const worst = mensual.reduce((a, b) => a['%_RECHAZO_S_BUENOS'] > b['%_RECHAZO_S_BUENOS'] ? a : b);

  const causasYtd = aggBy(rechazos, 'CAUSA').slice(0, CFG.topCausas || 8);
  const causasMaxKg = causasYtd[0]?.[1] || 1;
  const areasYtd = aggBy(rechazos, 'ÁREA RESP.');
  const areasTotalKg = areasYtd.reduce((s, a) => s + a[1], 0);

  const causasMes = aggBy(rechazosMes, 'CAUSA').slice(0, CFG.topCausas || 8);
  const causasMesMax = causasMes[0]?.[1] || 1;
  const areaMes = aggBy(rechazosMes, 'ÁREA RESP.');
  const areaMesTotal = areaMes.reduce((s, a) => s + a[1], 0);
  const topArea = areaMes[0];
  const topCausaMes = causasMes[0];

  const lotesMes = [...rechazosMes].sort((a, b) => b.KILOS - a.KILOS).slice(0, CFG.topLotes || 10);
  const totalLotesMesKg = rechazosMes.reduce((s, r) => s + (Number(r.KILOS) || 0), 0);

  document.getElementById('main').innerHTML = `
  <section class="view active" id="view-historico">
    <div class="topbar">
      <div><h1>Tablero de rechazos ATS</h1><p class="subtitle">Tasa de rechazo (kg rechazados / kg liberados) vs. meta ≤ ${fmtPct(meta)} — año ${CFG.year || curMonth.AÑO}</p></div>
      <div class="updated"><span>⟳</span><span>Última actualización<b>${lastUpdate ? fmtDate(lastUpdate, {day:'2-digit', month:'2-digit', year:'numeric'}) : '—'}</b></span></div>
    </div>
    <div class="kpis">
      <div class="kpi beacon ${ytdRate <= meta ? 'on-good' : 'on-bad'}"><span class="led ${ytdRate <= meta ? 'good' : 'bad'}"></span><span class="glyph">%</span><div class="label">Tasa de rechazo YTD</div><div class="value ${ytdRate <= meta ? 'good' : 'bad'}">${fmtPct(ytdRate)}</div><div class="foot"><span class="pill ${ytdRate <= meta ? 'good' : 'bad'}">${ytdRate <= meta ? 'Dentro de meta' : 'Fuera de meta'}</span></div>
        <div class="semaforo"><span class="z" style="width:50%;background:var(--good)"></span><span class="z" style="width:25%;background:oklch(80% 0.15 90)"></span><span class="z" style="width:25%;background:var(--bad)"></span><span class="pin" style="left:${Math.min(96, ytdRate / (meta * 2) * 100).toFixed(0)}%"></span></div>
      </div>
      <div class="kpi beacon on-good" style="animation:none"><span class="led good"></span><span class="glyph">✓</span><div class="label">Mejor mes</div><div class="value good">${fmtPct(best['%_RECHAZO_S_BUENOS'])}</div><div class="foot">${best.MES_NOMBRE}</div>
        <div class="semaforo"><span class="z" style="width:50%;background:var(--good)"></span><span class="z" style="width:25%;background:oklch(80% 0.15 90)"></span><span class="z" style="width:25%;background:var(--bad)"></span><span class="pin" style="left:${Math.min(96, best['%_RECHAZO_S_BUENOS'] / (meta * 2) * 100).toFixed(0)}%"></span></div>
      </div>
      <div class="kpi beacon on-bad" style="animation:none"><span class="led bad"></span><span class="glyph">!</span><div class="label">Peor mes</div><div class="value bad">${fmtPct(worst['%_RECHAZO_S_BUENOS'])}</div><div class="foot">${worst.MES_NOMBRE}</div>
        <div class="semaforo"><span class="z" style="width:50%;background:var(--good)"></span><span class="z" style="width:25%;background:oklch(80% 0.15 90)"></span><span class="z" style="width:25%;background:var(--bad)"></span><span class="pin" style="left:${Math.min(96, worst['%_RECHAZO_S_BUENOS'] / (meta * 2) * 100).toFixed(0)}%"></span></div>
      </div>
      <div class="kpi"><span class="glyph" style="position:absolute;right:-10px;bottom:-14px;font-size:74px;line-height:1;opacity:.07;pointer-events:none">⚖</span><div class="label">Kilos rechazados YTD</div><div class="value">${fmtKg(ytdMalos)}</div><div class="foot">sobre ${fmtKg(ytdBuenos)} liberados</div></div>
    </div>
    <div class="card full" style="margin-bottom:14px">
      <div class="card-head"><div><h2>% de rechazo mensual</h2><p class="desc">Kilos rechazados ÷ kilos de tela liberada, por mes</p></div><span class="badge">Meta ≤ ${fmtPct(meta)}</span></div>
      <div style="height:240px">${barChart({items: mensual.map(r => ({label: r.MES_NOMBRE.slice(0,3), value: r['%_RECHAZO_S_BUENOS']})), meta, height: 220})}</div>
      <div class="legend"><span><i class="dot good"></i>Dentro de meta</span><span><i class="dot bad"></i>Fuera de meta</span></div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="card-head"><div><h2>% de rechazo semanal</h2><p class="desc">Últimas ${semanal.length} semanas con datos</p></div></div>
        <div style="height:220px">${barChart({items: semanal.slice(-12).map(r => ({label: 'S' + r.SEMANA_ISO, value: r['%_RECHAZO_S_BUENOS']})), meta, height: 190})}</div>
      </div>
      <div class="card">
        <div class="card-head"><div><h2>Rechazos por área</h2><p class="desc">Distribución de kilos, acumulado del año</p></div></div>
        <div class="donut-wrap">
          <div class="donut" style="${donut(areasYtd, areasTotalKg)}"><div class="donut-center"><b>${fmtKg(areasTotalKg).replace(' kg','')}</b><span>kg totales</span></div></div>
          <div class="arealegend">${areasYtd.map((a, i) => `<div class="area-row"><span class="dot" style="background:${AREA_COLORS[i % AREA_COLORS.length]}"></span><span class="name">${a[0]}</span><span class="pct">${(a[1] / areasTotalKg * 100).toFixed(0)}%</span></div>`).join('')}</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><div><h2>Principales causas de rechazo</h2><p class="desc">Top ${causasYtd.length} por kilos, acumulado del año</p></div></div>
      <div class="rank">${causasYtd.map((c, i) => `<div class="rank-row"><span class="n">${i + 1}</span><div><span class="name">${c[0]}</span><div class="track"><i style="width:${(c[1] / causasMaxKg * 100).toFixed(0)}%"></i></div></div><span class="kg">${fmtKg(c[1])}</span></div>`).join('')}</div>
    </div>
  </section>

  <section class="view" id="view-diario">
    <div class="topbar">
      <div><h1>Tablero de rechazos ATS</h1><p class="subtitle">Desempeño diario frente a la meta ≤ ${fmtPct(meta)}</p></div>
      <div class="updated"><span>⟳</span><span>Corte al día<b>${fmtDate(lastDaySerial, {day:'2-digit', month:'2-digit', year:'numeric'})}</b></span></div>
    </div>
    <div class="kpis">
      <div class="kpi" style="display:flex;gap:14px;align-items:center;border-left:3px solid var(--bad)">
        <div style="width:46px;height:46px;border-radius:50%;background:var(--bad-soft);color:var(--bad);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none">KG</div>
        <div><div class="label" style="color:var(--bad)">Impacto del día</div><div style="font-size:12.5px;font-weight:700;margin-top:2px">Kilos rechazados</div><div class="value bad" style="margin-top:4px">${fmtKg(totalLotesMesKg)}</div><div class="foot">${rechazosMes.length} lotes rechazados</div></div>
      </div>
      <div class="kpi" style="border-left:3px solid var(--bad)">
        <div class="label" style="color:var(--bad)">% de kilos rechazados</div>
        <div class="value ${curMonth['%_RECHAZO_S_BUENOS'] <= meta ? 'good' : 'bad'}" style="margin-top:6px">${fmtPct(curMonth['%_RECHAZO_S_BUENOS'])}</div>
        <div class="foot" style="margin-top:8px"><span class="pill ${curMonth['%_RECHAZO_S_BUENOS'] <= meta ? 'good' : 'bad'}">${curMonth['%_RECHAZO_S_BUENOS'] <= meta ? 'Dentro de meta' : 'Fuera de meta'}</span></div>
      </div>
      <div class="kpi" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px">
        <div style="width:34px;height:34px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:16px">▤</div>
        <div class="value" style="font-size:26px">${rechazosMes.length}</div>
        <div class="foot" style="line-height:1.2">Lotes<br>rechazados</div>
      </div>
      <div class="kpi" style="border-left:3px solid var(--bad)">
        <div class="label" style="color:var(--bad)">Principal área afectada</div>
        <div class="value" style="font-size:19px;margin-top:6px">${topArea ? topArea[0] : '—'}</div>
        <div class="foot" style="margin-top:8px">${topArea ? fmtKg(topArea[1]) : ''}${topArea ? ` · ${(topArea[1] / areaMesTotal * 100).toFixed(1)}%` : ''}</div>
        <div class="track" style="margin-top:6px"><i style="width:${topArea ? (topArea[1] / areaMesTotal * 100).toFixed(0) : 0}%;background:var(--bad)"></i></div>
      </div>
    </div>
    <div class="grid2">
      <div class="card">
        <div class="card-head"><div><h2>Causas del mes</h2><p class="desc">Top ${causasMes.length} por kilos</p></div></div>
        <div class="rank">${causasMes.map((c, i) => `<div class="rank-row"><span class="n">${i + 1}</span><div><span class="name">${c[0]}</span><div class="track"><i style="width:${(c[1] / causasMesMax * 100).toFixed(0)}%"></i></div></div><span class="kg">${fmtKg(c[1])}</span></div>`).join('')}</div>
      </div>
      <div class="card">
        <div class="card-head"><div><h2>Rechazos por área — mes</h2></div></div>
        <div class="donut-wrap">
          <div class="donut" style="${donut(areaMes, areaMesTotal)}"><div class="donut-center"><b>${fmtKg(areaMesTotal).replace(' kg','')}</b><span>kg del mes</span></div></div>
          <div class="arealegend">${areaMes.map((a, i) => `<div class="area-row"><span class="dot" style="background:${AREA_COLORS[i % AREA_COLORS.length]}"></span><span class="name">${a[0]}</span><span class="pct">${(a[1] / areaMesTotal * 100).toFixed(0)}%</span></div>`).join('')}</div>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><div><h2>Lotes con mayor rechazo</h2><p class="desc">Top ${lotesMes.length} del mes por kilos</p></div></div>
      <table>
        <thead><tr><th>Fecha</th><th>CPOP</th><th>Cliente</th><th>Área</th><th>Causa</th><th>Turno</th><th style="text-align:right">Kg</th></tr></thead>
        <tbody>${lotesMes.map(r => `<tr><td>${fmtDate(r['FECHA RECHAZO'])}</td><td>${clean(r.CPOP)}</td><td>${clean(r.CLIENTE)}</td><td>${clean(r['ÁREA RESP.'])}</td><td>${clean(r.CAUSA)}</td><td>${clean(r.TURNO)}</td><td class="num">${Number(r.KILOS).toFixed(0)}</td></tr>`).join('')}</tbody>
      </table>
    </div>
    <div class="card full">
      <div class="card-head"><div><h2>% de rechazo diario</h2><p class="desc">Kilos rechazados ÷ kilos liberados, por día del mes</p></div><span class="badge">Meta ≤ ${fmtPct(meta)}</span></div>
      <div style="display:flex;gap:8px">
        <div style="display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);font-size:10.5px;font-weight:600;color:var(--ink-soft);white-space:nowrap">% de rechazo (kg malos / kg buenos)</div>
        <div style="flex:1;min-width:0">${dailyChart({items: diaria.map(r => ({serial: r.FECHA, value: r['%_RECHAZO_S_BUENOS']})), meta, upToSerial: lastDaySerial, height: 220})}</div>
      </div>
      <div class="legend"><span><i class="dot good"></i>Dentro de meta</span><span><i class="dot bad"></i>Fuera de meta</span><span><i class="dot pending"></i>Sin datos aún</span></div>
    </div>
  </section>`;

  document.querySelectorAll('nav.nav button').forEach(btn => btn.onclick = () => {
    document.querySelectorAll('nav.nav button').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + btn.dataset.view));
  });
}

loadData().then(render).catch(err => {
  document.getElementById('main').innerHTML = `<div class="state"><b>No se pudieron cargar los datos</b><span>${err.message}</span><span>Verifica que <code>${CFG.dataFileName}</code> esté publicado junto a <code>index.html</code> y que la página se sirva por http(s) (no abierta como archivo local).</span></div>`;
});
</script>
</body>
</html>
